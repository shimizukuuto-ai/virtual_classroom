{% extends "base.html" %}
{% block title %}{{ cls.title }} - {{ T.room_study }}{% endblock %}
{% block content %}
<style>
  body { background: #0f172a !important; margin: 0; overflow: hidden; }
  #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
  .room-info {
    position: absolute; top: 20px; left: 20px; z-index: 10; color: #fff;
    background: rgba(15, 23, 42, 0.8); padding: 15px 20px; border-radius: 12px;
    backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); pointer-events: none;
  }
  .ui-overlay {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 15px; z-index: 10; background: rgba(15, 23, 42, 0.8);
    padding: 15px 25px; border-radius: 50px; backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
  }
  .ui-overlay button {
    padding: 10px 24px; border-radius: 30px; border: none; font-size: 15px;
    font-weight: bold; cursor: pointer; color: #fff; transition: all 0.2s;
  }
  .ui-overlay button:hover { transform: scale(1.05); opacity: 0.9; }
  .btn-focus { background: #3b82f6; }
  .btn-break { background: #10b981; }
  .btn-stop { background: #ef4444; }
  .chat-panel {
    position: absolute; right: 20px; top: 20px; width: 300px; height: calc(100vh - 120px);
    background: rgba(30, 41, 59, 0.9); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    display: flex; flex-direction: column; z-index: 10; backdrop-filter: blur(10px);
  }
  .chat-header { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); color: #fff; font-weight: bold; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; }
  .chat-msg { font-size: 13px; color: #e2e8f0; line-height: 1.4; word-break: break-all; }
  .chat-msg .name { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 2px; }
  .chat-input-area { padding: 10px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 8px; }
  .chat-input-area input { flex: 1; padding: 8px 12px; border-radius: 6px; border: none; background: rgba(0,0,0,0.3); color: #fff; outline: none; }
  .chat-input-area button { padding: 8px 12px; border-radius: 6px; border: none; background: #3b82f6; color: #fff; cursor: pointer; }
</style>

<div class="room-info">
  <h2 style="margin: 0; font-size: 20px; color: #e2e8f0;">{{ cls.title }}</h2>
  <div style="font-size: 13px; color: #94a3b8; margin-top: 4px;">{{ T.room_study }} · {{ cls.subject }} ({{ members|length }}/12)</div>
</div>

<div id="canvas-container"></div>

<div class="ui-overlay">
  <button id="btn-focus" class="btn-focus">Focus (25m)</button>
  <button id="btn-break" class="btn-break">Break (5m)</button>
  <button id="btn-stop" class="btn-stop">Stop</button>
</div>

<div class="chat-panel">
  <div class="chat-header">Chat</div>
  <div class="chat-messages" id="chat-messages"></div>
  <form class="chat-input-area" id="chat-form">
    <input type="text" id="chat-input" placeholder="Message..." autocomplete="off">
    <button type="submit">Send</button>
  </form>
</div>

<script type="importmap">
{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.CLASS_ID = {{ cls.id }};
window.USER_ID = {{ user.id }};
window.MEMBERS = {{ members|tojson }};

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e293b);
scene.fog = new THREE.Fog(0x1e293b, 15, 40);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 8, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, -2);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 5;
controls.maxDistance = 25;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xfff0d0, 1.0);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
scene.add(dirLight);

const floorMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), wallMat);
backWall.position.set(0, 5, -8);
backWall.receiveShadow = true;
scene.add(backWall);

// 入口（Entrance）の表現
const entranceMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, emissive: 0x3b82f6, emissiveIntensity: 0.5 });
const entrance = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.1, 32), entranceMat);
entrance.position.set(0, 0.05, 6);
scene.add(entrance);

// タイマー（壁掛け）
const timerCanvas = document.createElement('canvas');
timerCanvas.width = 1024;
timerCanvas.height = 512;
const ctx = timerCanvas.getContext('2d');
const timerTexture = new THREE.CanvasTexture(timerCanvas);
timerTexture.colorSpace = THREE.SRGBColorSpace;
timerTexture.minFilter = THREE.LinearFilter;
timerTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

function drawTimer(state, minutes, seconds, labelText) {
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, 1024, 512);
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 16;
  ctx.strokeRect(8, 8, 1008, 496);

  ctx.fillStyle = state === 'focus' ? '#60a5fa' : state === 'break' ? '#34d399' : '#94a3b8';
  ctx.font = 'bold 60px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(labelText, 512, 130);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 260px monospace';
  ctx.fillText(`${minutes}:${seconds}`, 512, 320);

  timerTexture.needsUpdate = true;
}

const timerBoard = new THREE.Mesh(
  new THREE.PlaneGeometry(8, 4),
  new THREE.MeshBasicMaterial({ map: timerTexture })
);
timerBoard.position.set(0, 4.5, -7.9);
scene.add(timerBoard);

const frame = new THREE.Mesh(new THREE.BoxGeometry(8.4, 4.4, 0.2), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
frame.position.set(0, 4.5, -8.0);
scene.add(frame);

const seatPositions = [];
for (let row = 0; row < 3; row++) {
  for (let col = 0; col < 4; col++) {
    const x = -4.5 + col * 3;
    const z = -2 + row * 3;
    seatPositions.push({ x, z });
  }
}

function createDeskAndChair(x, z) {
  const group = new THREE.Group();
  const deskTop = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 1), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
  deskTop.position.y = 0.75;
  deskTop.castShadow = true; deskTop.receiveShadow = true;
  group.add(deskTop);
  
  const legGeo = new THREE.BoxGeometry(0.1, 0.75, 0.1);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21 });
  [[-0.9, -0.4], [0.9, -0.4], [-0.9, 0.4], [0.9, 0.4]].forEach(([lx, lz]) => {
    const leg = new THREE.Mesh(legGeo, legMat);
    leg.position.set(lx, 0.375, lz);
    leg.castShadow = true; group.add(leg);
  });

  const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.6), new THREE.MeshStandardMaterial({ color: 0x3b82f6 }));
  chairSeat.position.set(0, 0.5, 0.8);
  chairSeat.castShadow = true; group.add(chairSeat);

  const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.1), new THREE.MeshStandardMaterial({ color: 0x3b82f6 }));
  chairBack.position.set(0, 0.8, 1.1);
  chairBack.castShadow = true; group.add(chairBack);

  group.position.set(x, 0, z);
  return group;
}

seatPositions.forEach((p) => {
  scene.add(createDeskAndChair(p.x, p.z));
});

// 教室と同じアバター関数
function createChibiAvatar({ name, seated = false, customHair = -1, customSkin = -1, customShirt = -1 }) {
  const g = new THREE.Group();
  const skinColors = [0xffd8b0, 0xffe0bd, 0xe0ac69, 0x8d5524, 0x5c3a21, 0x2a1a0a];
  const shirtColors = [0x3b82f6, 0xef4444, 0x10b981, 0xf59e0b, 0x8b5cf6, 0xec4899, 0x64748b, 0x14b8a6];
  const hairColors = [0x2a1a0a, 0x4a2e15, 0x8b5a2b, 0xd2b48c, 0x1e293b, 0x94a3b8, 0xdc2626, 0xf59e0b, 0xec4899];
  
  const sColor = customSkin >= 0 ? skinColors[customSkin % skinColors.length] : 0xffd8b0;
  const bColor = customShirt >= 0 ? shirtColors[customShirt % shirtColors.length] : 0x3b82f6;
  const hColor = customHair >= 0 ? hairColors[customHair % hairColors.length] : 0x2a1a0a;

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 0.6, 16), new THREE.MeshStandardMaterial({ color: bColor, roughness: 0.7 }));
  body.position.y = seated ? 0.55 : 0.7; body.castShadow = true; g.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 24), new THREE.MeshStandardMaterial({ color: sColor, roughness: 0.55 }));
  head.position.y = seated ? 1.1 : 1.25; head.castShadow = true; g.add(head);

  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.335, 24, 24, 0, Math.PI * 2, 0, Math.PI / 1.75), new THREE.MeshStandardMaterial({ color: hColor, roughness: 0.8 }));
  hair.position.copy(head.position); hair.position.y += 0.02; g.add(hair);

  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
  const eyeGeo = new THREE.SphereGeometry(0.05, 12, 12);
  const eyeY = head.position.y + 0.02;
  const lEye = new THREE.Mesh(eyeGeo, eyeMat); lEye.position.set(-0.11, eyeY, 0.28); g.add(lEye);
  const rEye = new THREE.Mesh(eyeGeo, eyeMat); rEye.position.set(0.11, eyeY, 0.28); g.add(rEye);

  const armMat = new THREE.MeshStandardMaterial({ color: bColor, roughness: 0.7 });
  const armGeo = new THREE.CylinderGeometry(0.07, 0.07, 0.55, 8);
  const armY = seated ? 0.6 : 0.72;
  const lArm = new THREE.Mesh(armGeo, armMat); lArm.position.set(-0.36, armY, 0); lArm.rotation.z = 0.3; lArm.castShadow = true; g.add(lArm);
  const rArm = new THREE.Mesh(armGeo, armMat); rArm.position.set(0.36, armY, 0); rArm.rotation.z = -0.3; rArm.castShadow = true; g.add(rArm);

  if (!seated) {
    const legMat = new THREE.MeshStandardMaterial({ color: 0x333a4a });
    const legGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.42, 8);
    const lLeg = new THREE.Mesh(legGeo, legMat); lLeg.position.set(-0.12, 0.21, 0); g.add(lLeg);
    const rLeg = new THREE.Mesh(legGeo, legMat); rLeg.position.set(0.12, 0.21, 0); g.add(rLeg);
  }

  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const cctx = c.getContext('2d');
  cctx.fillStyle = "rgba(15,23,42,0.8)"; cctx.roundRect(8, 8, 240, 48, 24); cctx.fill();
  cctx.fillStyle = "#fff"; cctx.font = "bold 26px 'Hiragino Sans', sans-serif"; cctx.textAlign = "center"; cctx.textBaseline = "middle";
  cctx.fillText(name, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, depthWrite: false, transparent: true }));
  sp.scale.set(1.5, 0.375, 1); sp.position.y = seated ? 1.72 : 1.9; sp.renderOrder = 999; g.add(sp);

  return g;
}

const avatarMap = {}; 
const targetPositions = {}; 

function updateAvatarPositions(members, positions) {
  members.forEach((m, idx) => {
    if (m.role === 'teacher') return;
    const uid = String(m.id);
    const seatIdx = positions[uid] !== undefined ? positions[uid] : -1;
    
    // 席が割り当てられていればそこへ、なければ入口へ
    let targetX = 0, targetZ = 6; // 入口
    let isSeated = false;
    
    if (seatIdx >= 0 && seatIdx < seatPositions.length) {
      const seat = seatPositions[seatIdx];
      targetX = seat.x;
      targetZ = seat.z + 0.8;
      isSeated = true;
    }
    
    targetPositions[uid] = { x: targetX, z: targetZ };
    
    if (!avatarMap[uid]) {
      const av = createChibiAvatar({ 
        name: m.name, 
        seated: isSeated, 
        customHair: m.custom_hair, 
        customSkin: m.custom_skin, 
        customShirt: m.custom_shirt 
      });
      av.position.set(targetX, 0, targetZ);
      scene.add(av);
      avatarMap[uid] = av;
    } else {
      // 既存のアバターの座り状態を更新
      const av = avatarMap[uid];
      const body = av.children[0];
      if (isSeated) {
        body.position.y = 0.55;
        av.children[1].position.y = 1.1; // head
      } else {
        body.position.y = 0.7;
        av.children[1].position.y = 1.25; // head
      }
    }
  });
}

function animate() {
  requestAnimationFrame(animate);
  Object.keys(targetPositions).forEach(uid => {
    const av = avatarMap[uid];
    const target = targetPositions[uid];
    if (av && target) {
      av.position.x += (target.x - av.position.x) * 0.1;
      av.position.z += (target.z - av.position.z) * 0.1;
    }
  });
  controls.update();
  renderer.render(scene, camera);
}
animate();

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const clickableSeats = [];

seatPositions.forEach((p, i) => {
  const hitBox = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshBasicMaterial({ visible: false }));
  hitBox.position.set(p.x, 0.5, p.z + 0.5);
  hitBox.userData.seatIndex = i;
  scene.add(hitBox);
  clickableSeats.push(hitBox);
});

container.addEventListener('pointerdown', (e) => {
  const startX = e.clientX;
  const startY = e.clientY;
  
  const onPointerUp = async (upEvent) => {
    if (Math.abs(upEvent.clientX - startX) > 5 || Math.abs(upEvent.clientY - startY) > 5) return;
    
    mouse.x = (upEvent.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(upEvent.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableSeats);
    
    if (intersects.length > 0) {
      const seatIdx = intersects[0].object.userData.seatIndex;
      await fetch(`/api/study/${window.CLASS_ID}/move`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seat_index: seatIdx })
      });
      poll();
    }
    container.removeEventListener('pointerup', onPointerUp);
  };
  container.addEventListener('pointerup', onPointerUp);
});

let timeLeft = 1500;
let isRunning = false;
let mode = 'idle';
let lastTime = performance.now();

function updateTimerDisplay() {
  const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
  const s = String(timeLeft % 60).padStart(2, '0');
  let label = 'READY';
  if (mode === 'focus') label = 'FOCUS TIME';
  if (mode === 'break') label = 'BREAK TIME';
  drawTimer(mode, m, s, label);
}
updateTimerDisplay();

async function startPomodoro(duration) {
  await fetch(`/api/pomodoro/${window.CLASS_ID}/start`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ duration })
  });
  poll();
}

setInterval(() => {
  if (isRunning && timeLeft > 0) {
    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;
    timeLeft -= dt;
    
    if (timeLeft <= 0) {
      timeLeft = 0;
      isRunning = false;
      if (mode === 'focus') {
        mode = 'break';
        startPomodoro(300); 
      } else if (mode === 'break') {
        mode = 'focus';
        startPomodoro(1500); 
      }
    }
    updateTimerDisplay();
  }
}, 1000);

let lastMessageId = 0;
let hasAutoSeated = false;

async function poll() {
  try {
    const res = await fetch(`/api/poll/${window.CLASS_ID}`, { method: 'POST' });
    const data = await res.json();
    
    if (data.pomodoro) {
      mode = data.pomodoro.state;
      if (mode !== 'idle' && data.pomodoro.ends_at) {
        timeLeft = Math.max(0, Math.floor((new Date(data.pomodoro.ends_at).getTime() - Date.now()) / 1000));
        isRunning = true;
      } else {
        isRunning = false;
        timeLeft = mode === 'break' ? 300 : 1500;
      }
      updateTimerDisplay();
    }
    
    if (data.members && data.study_positions) {
      updateAvatarPositions(data.members, data.study_positions);
      
      // 自分がまだ席に座っていない場合、空いている席を探して自動で座る
      if (!hasAutoSeated) {
        const mySeat = data.study_positions[String(window.USER_ID)];
        if (mySeat === undefined) {
          const occupied = new Set(Object.values(data.study_positions));
          for (let i = 0; i < seatPositions.length; i++) {
            if (!occupied.has(i)) {
              await fetch(`/api/study/${window.CLASS_ID}/move`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seat_index: i })
              });
              hasAutoSeated = true;
              break;
            }
          }
        } else {
          hasAutoSeated = true;
        }
      }
    }
    
    if (data.messages) {
      const chatBox = document.getElementById('chat-messages');
      data.messages.forEach(m => {
        if (m.id > lastMessageId) {
          lastMessageId = m.id;
          const el = document.createElement('div');
          el.className = 'chat-msg';
          el.innerHTML = `<span class="name">${m.name}</span>${m.content}`;
          chatBox.appendChild(el);
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      });
    }
  } catch (e) { console.error(e); }
}
setInterval(poll, 3000);
poll();

document.getElementById('btn-focus').onclick = () => startPomodoro(1500);
document.getElementById('btn-break').onclick = () => startPomodoro(300);
document.getElementById('btn-stop').onclick = async () => {
  await fetch(`/api/pomodoro/${window.CLASS_ID}/stop`, { method: 'POST' });
  poll();
};

document.getElementById('chat-form').onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await fetch(`/api/announce/${window.CLASS_ID}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text })
  });
  poll();
};

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
{% endblock %}
