{% extends "base.html" %}
{% block title %}{{ cls.title }} - {{ T.room_study }}{% endblock %}
{% block content %}
<style>
  body { background: #0f172a !important; margin: 0; overflow: hidden; }
  #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
  .room-info {
    position: absolute; top: 20px; left: 20px; z-index: 10; color: #fff;
    background: rgba(15, 23, 42, 0.8); padding: 15px 20px; border-radius: 12px;
    backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); pointer-events: none;
  }
  .ui-overlay {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 15px; z-index: 10; background: rgba(15, 23, 42, 0.8);
    padding: 15px 25px; border-radius: 50px; backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
  }
  .ui-overlay button {
    padding: 10px 24px; border-radius: 30px; border: none; font-size: 15px;
    font-weight: bold; cursor: pointer; color: #fff; transition: all 0.2s;
  }
  .ui-overlay button:hover { transform: scale(1.05); opacity: 0.9; }
  .btn-focus { background: #3b82f6; }
  .btn-break { background: #10b981; }
  .btn-stop { background: #ef4444; }
  .chat-panel {
    position: absolute; right: 20px; top: 20px; width: 300px; height: calc(100vh - 120px);
    background: rgba(30, 41, 59, 0.9); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
    display: flex; flex-direction: column; z-index: 10; backdrop-filter: blur(10px);
  }
  .chat-header { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); color: #fff; font-weight: bold; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; }
  .chat-msg { font-size: 13px; color: #e2e8f0; line-height: 1.4; word-break: break-all; }
  .chat-msg .name { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 2px; }
  .chat-input-area { padding: 10px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 8px; }
  .chat-input-area input { flex: 1; padding: 8px 12px; border-radius: 6px; border: none; background: rgba(0,0,0,0.3); color: #fff; outline: none; }
  .chat-input-area button { padding: 8px 12px; border-radius: 6px; border: none; background: #3b82f6; color: #fff; cursor: pointer; }
</style>

<div class="room-info">
  <h2 style="margin: 0; font-size: 20px; color: #e2e8f0;">{{ cls.title }}</h2>
  <div style="font-size: 13px; color: #94a3b8; margin-top: 4px;">{{ T.room_study }} · {{ cls.subject }} ({{ members|length }}/12)</div>
</div>

<div id="canvas-container"></div>

<div class="ui-overlay">
  <button id="btn-focus" class="btn-focus">Focus (25m)</button>
  <button id="btn-break" class="btn-break">Break (5m)</button>
  <button id="btn-stop" class="btn-stop">Stop</button>
</div>

<div class="chat-panel">
  <div class="chat-header">Chat</div>
  <div class="chat-messages" id="chat-messages"></div>
  <form class="chat-input-area" id="chat-form">
    <input type="text" id="chat-input" placeholder="Message..." autocomplete="off">
    <button type="submit">Send</button>
  </form>
</div>

<script type="importmap">
{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.CLASS_ID = {{ cls.id }};
window.USER_ID = {{ user.id }};
window.MEMBERS = {{ members|tojson }};

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e293b);
scene.fog = new THREE.Fog(0x1e293b, 15, 40);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 8, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, -2);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 5;
controls.maxDistance = 25;

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dirLight = new THREE.DirectionalLight(0xfff0d0, 1.0);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
scene.add(dirLight);

const spotLight = new THREE.SpotLight(0xffeedd, 1.5);
spotLight.position.set(0, 10, 0);
spotLight.angle = Math.PI / 4;
spotLight.penumbra = 0.5;
spotLight.castShadow = true;
scene.add(spotLight);

const floorMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), wallMat);
backWall.position.set(0, 5, -8);
backWall.receiveShadow = true;
scene.add(backWall);

const timerCanvas = document.createElement('canvas');
timerCanvas.width = 1024;
timerCanvas.height = 512;
const ctx = timerCanvas.getContext('2d');
const timerTexture = new THREE.CanvasTexture(timerCanvas);
timerTexture.colorSpace = THREE.SRGBColorSpace;
timerTexture.minFilter = THREE.LinearFilter;

function drawTimer(state, minutes, seconds, labelText) {
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, 1024, 512);
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 16;
  ctx.strokeRect(8, 8, 1008, 496);

  ctx.fillStyle = state === 'focus' ? '#60a5fa' : state === 'break' ? '#34d399' : '#94a3b8';
  ctx.font = 'bold 60px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(labelText, 512, 130);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 240px monospace';
  ctx.fillText(`${minutes}:${seconds}`, 512, 310);

  timerTexture.needsUpdate = true;
}

const timerBoard = new THREE.Mesh(
  new THREE.PlaneGeometry(8, 4),
  new THREE.MeshBasicMaterial({ map: timerTexture })
);
timerBoard.position.set(0, 4.5, -7.9);
scene.add(timerBoard);

const frame = new THREE.Mesh(new THREE.BoxGeometry(8.4, 4.4, 0.2), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
frame.position.set(0, 4.5, -8.0);
scene.add(frame);

const SEATS = [];
const seatPositions = [];
for (let row = 0; row < 3; row++) {
  for (let col = 0; col < 4; col++) {
    const x = -4.5 + col * 3;
    const z = -2 + row * 3;
    seatPositions.push({ x, z });
  }
}

function createDeskAndChair(x, z) {
  const group = new THREE.Group();
  const deskTop = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 1), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
  deskTop.position.y = 0.75;
  deskTop.castShadow = true; deskTop.receiveShadow = true;
  group.add(deskTop);
  
  const legGeo = new THREE.BoxGeometry(0.1, 0.75, 0.1);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21 });
  [[-0.9, -0.4], [0.9, -0.4], [-0.9, 0.4], [0.9, 0.4]].forEach(([lx, lz]) => {
    const leg = new THREE.Mesh(legGeo, legMat);
    leg.position.set(lx, 0.375, lz);
    leg.castShadow = true; group.add(leg);
  });

  const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 0.6), new THREE.MeshStandardMaterial({ color: 0x3b82f6 }));
  chairSeat.position.set(0, 0.5, 0.8);
  chairSeat.castShadow = true; group.add(chairSeat);

  const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.1), new THREE.MeshStandardMaterial({ color: 0x3b82f6 }));
  chairBack.position.set(0, 0.8, 1.1);
  chairBack.castShadow = true; group.add(chairBack);

  group.position.set(x, 0, z);
  return group;
}

seatPositions.forEach((p, i) => {
  scene.add(createDeskAndChair(p.x, p.z));
  SEATS.push({ index: i, x: p.x, z: p.z, mesh: null });
});

function createChibiAvatar({ name, seated = false, skinKey = "default", isTeacher = false }) {
      const g = new THREE.Group();
      const pal = paletteFor(name);
      const skinColors = { default: 0x3b82f6, glasses: 0x6366f1, hat: 0xf59e0b, robe: 0x8b5cf6, crown: 0xfbbf24, aura: 0xef4444 };
      const shirtColor = (skinKey !== "default" && skinColors[skinKey]) || pal.shirt;
      const headY = seated ? 1.20 : 1.40;
      const bodyY = seated ? 0.68 : 0.85;
      const bs = pal.bodyScale;

      // legs
      const legMat = new THREE.MeshStandardMaterial({ color: pal.pants, roughness: 0.85 });
      const lLeg = new THREE.Mesh(LEG_GEO, legMat);
      lLeg.position.set(-0.17, 0.22, 0); lLeg.castShadow = true;
      const rLeg = new THREE.Mesh(LEG_GEO, legMat);
      rLeg.position.set(0.17, 0.22, 0); rLeg.castShadow = true;
      g.add(lLeg, rLeg);

      // shoes
      const lShoe = new THREE.Mesh(SHOE_GEO, SHOE_MAT);
      lShoe.position.set(-0.17, 0.07, 0.06); lShoe.scale.set(1, 0.7, 1.35); lShoe.castShadow = true;
      const rShoe = new THREE.Mesh(SHOE_GEO, SHOE_MAT);
      rShoe.position.set(0.17, 0.07, 0.06); rShoe.scale.set(1, 0.7, 1.35); rShoe.castShadow = true;
      g.add(lShoe, rShoe);

      // torso
      const torsoMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.78 });
      const torso = new THREE.Mesh(TORSO_GEO, torsoMat);
      torso.position.y = bodyY;
      torso.scale.set(bs, 1, bs);
      torso.castShadow = true;
      g.add(torso);

      // collar / tie
      const collarMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 });
      const collar = new THREE.Mesh(new THREE.RingGeometry(0.14, 0.20, 14, 1, 0, Math.PI), collarMat);
      collar.position.set(0, bodyY + 0.36, 0.30);
      collar.rotation.x = -Math.PI/6;
      g.add(collar);
      if (isTeacher) {
        const tie = new THREE.Mesh(
          new THREE.BoxGeometry(0.08, 0.35, 0.03),
          new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.7 })
        );
        tie.position.set(0, bodyY + 0.15, 0.36);
        g.add(tie);
      }

      // arms
      const armMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.78 });
      const handMat = new THREE.MeshStandardMaterial({ color: pal.skin, roughness: 0.6 });
      const armY = bodyY + 0.04;

      const lUpper = new THREE.Mesh(UPPER_ARM_GEO, armMat);
      lUpper.position.set(-0.42, armY - 0.06, 0);
      lUpper.rotation.z = 0.28; lUpper.castShadow = true;
      const lLower = new THREE.Mesh(LOWER_ARM_GEO, armMat);
      lLower.position.set(-0.52, armY - 0.32, 0.02);
      lLower.rotation.z = 0.15; lLower.castShadow = true;
      const lHand = new THREE.Mesh(HAND_GEO, handMat);
      lHand.position.set(-0.56, armY - 0.5, 0.03);
      g.add(lUpper, lLower, lHand);

      const rArmGroup = new THREE.Group();
      rArmGroup.position.set(0.42, armY - 0.06, 0);
      const rUpper = new THREE.Mesh(UPPER_ARM_GEO, armMat);
      rUpper.castShadow = true;
      const rLower = new THREE.Mesh(LOWER_ARM_GEO, armMat);
      rLower.position.set(0.10, -0.26, 0.02); rLower.castShadow = true;
      const rHand = new THREE.Mesh(HAND_GEO, handMat);
      rHand.position.set(0.14, -0.44, 0.03);
      rArmGroup.add(rUpper, rLower, rHand);
      g.add(rArmGroup);

      // head group (so we can rotate separately)
      const headGroup = new THREE.Group();
      headGroup.position.y = headY;

      const headMat = new THREE.MeshStandardMaterial({ color: pal.skin, roughness: 0.55 });
      const head = new THREE.Mesh(HEAD_GEO, headMat);
      head.scale.set(1, 1.06, 0.96);
      head.castShadow = true;
      headGroup.add(head);

      // neck
      const neck = new THREE.Mesh(NECK_GEO, headMat);
      neck.position.y = -0.42;
      headGroup.add(neck);

      // ears
      [-0.46, 0.46].forEach(x => {
        const ear = new THREE.Mesh(EAR_GEO, headMat);
        ear.position.set(x, 0, 0);
        headGroup.add(ear);
      });

      // hair
      buildHair(headGroup, head, pal.style, pal.hair);

      // eyes (grouped for blink)
      const eyeY = 0.02;
      const eyeZ = 0.43;
      const eyeOffset = 0.16;
      const eyeGroups = [];
      [-1, 1].forEach(side => {
        const grp = new THREE.Group();
        const white = new THREE.Mesh(EYE_WHITE_GEO, EYE_WHITE_MAT);
        white.scale.set(1, 1, 0.55);
        const pupil = new THREE.Mesh(EYE_PUPIL_GEO, EYE_PUPIL_MAT);
        pupil.position.set(0, 0, 0.058);
        const highlight = new THREE.Mesh(EYE_HIGHLIGHT_GEO, EYE_HIGHLIGHT_MAT);
        highlight.position.set(0.026, 0.03, 0.085);
        grp.add(white, pupil, highlight);
        grp.position.set(side * eyeOffset, eyeY, eyeZ);
        headGroup.add(grp);
        eyeGroups.push(grp);
      });

      // eyebrows
      const browMat = new THREE.MeshBasicMaterial({ color: pal.hair });
      [-1, 1].forEach(side => {
        const b = new THREE.Mesh(BROW_GEO, browMat);
        b.position.set(side * eyeOffset, eyeY + 0.13, eyeZ);
        b.rotation.z = side * 0.08;
        headGroup.add(b);
      });

      // nose
      const nose = new THREE.Mesh(NOSE_GEO, headMat);
      nose.position.set(0, eyeY - 0.05, eyeZ + 0.02);
      headGroup.add(nose);

      // mouth
      const mouth = new THREE.Mesh(MOUTH_GEO, MOUTH_MAT);
      mouth.position.set(0, eyeY - 0.20, eyeZ + 0.02);
      mouth.scale.set(1.4, 0.35, 0.6);
      headGroup.add(mouth);

      // blush
      [-1, 1].forEach(side => {
        const blush = new THREE.Mesh(BLUSH_GEO, BLUSH_MAT);
        blush.position.set(side * 0.32, eyeY - 0.1, 0.37);
        blush.rotation.y = side * 0.3;
        headGroup.add(blush);
      });

      addSkinAccessory(headGroup, head, skinKey, seated);

      g.add(headGroup);

      if (name) {
        const sp = makeNameSprite(name, isTeacher);
        sp.position.y = seated ? 1.95 : 2.20;
        g.add(sp);
      }

      g.userData = {
        rArmGroup, headGroup, head, torso, mouth,
        eyeL: eyeGroups[0], eyeR: eyeGroups[1],
        baseY: g.position.y,
        handRaised: false,
        highlight: 0,
        talkUntil: 0,
        gestureUntil: 0,
        nextBlink: performance.now() + 2000 + Math.random() * 3000,
        blinkUntil: 0,
        breathingOffset: Math.random() * Math.PI * 2,
        lookOffset: Math.random() * Math.PI * 2,
        swayPhase: Math.random() * Math.PI * 2,
        fidgetPhase: Math.random() * Math.PI * 2,
        baseHeadRotY: 0,
        targetHeadRotY: 0,
        baseHeadRotX: 0,
        targetHeadRotX: 0,
        lUpper, lLower, lHand,
        name,
      };
      return g;
    }

const avatarMap = {}; 



const targetPositions = {}; 

function updateAvatarPositions(positions) {
  const colors = [0xef4444, 0x3b82f6, 0x10b981, 0xf59e0b, 0x8b5cf6, 0xec4899, 0x14b8a6, 0xf43f5e, 0x8b5cf6, 0xd946ef, 0x06b6d4, 0x84cc16];
  
  window.MEMBERS.forEach((m, idx) => {
    const uid = String(m.user_id);
    const seatIdx = positions[uid] !== undefined ? positions[uid] : -1;
    
    if (seatIdx >= 0 && seatIdx < seatPositions.length) {
      const seat = seatPositions[seatIdx];
      targetPositions[uid] = { x: seat.x, z: seat.z + 0.8 }; 
      
      if (!avatarMap[uid]) {
        const color = m.user_id === window.USER_ID ? 0x3b82f6 : colors[idx % colors.length];
        const av = createChibiAvatar({ name: m.name, seated: true, skinKey: m.skin || 'default', customHair: m.custom_hair, customSkin: m.custom_skin, customShirt: m.custom_shirt, customStyle: m.custom_style });
        av.position.set(seat.x, 0, seat.z + 0.8);
        scene.add(av);
        avatarMap[uid] = av;
      }
    }
  });
}

function animate() {
  requestAnimationFrame(animate);
  Object.keys(targetPositions).forEach(uid => {
    const av = avatarMap[uid];
    const target = targetPositions[uid];
    if (av && target) {
      av.position.x += (target.x - av.position.x) * 0.1;
      av.position.z += (target.z - av.position.z) * 0.1;
    }
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const clickableSeats = [];

seatPositions.forEach((p, i) => {
  const hitBox = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshBasicMaterial({ visible: false }));
  hitBox.position.set(p.x, 0.5, p.z + 0.5);
  hitBox.userData.seatIndex = i;
  scene.add(hitBox);
  clickableSeats.push(hitBox);
});

container.addEventListener('pointerdown', (e) => {
  const startX = e.clientX;
  const startY = e.clientY;
  
  const onPointerUp = async (upEvent) => {
    if (Math.abs(upEvent.clientX - startX) > 5 || Math.abs(upEvent.clientY - startY) > 5) return;
    
    mouse.x = (upEvent.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(upEvent.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableSeats);
    
    if (intersects.length > 0) {
      const seatIdx = intersects[0].object.userData.seatIndex;
      await fetch(`/api/study/${window.CLASS_ID}/move`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seat_index: seatIdx })
      });
      poll();
    }
    container.removeEventListener('pointerup', onPointerUp);
  };
  container.addEventListener('pointerup', onPointerUp);
});

let timeLeft = 1500;
let isRunning = false;
let mode = 'idle';
let lastTime = performance.now();

function updateTimerDisplay() {
  const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
  const s = String(timeLeft % 60).padStart(2, '0');
  let label = 'READY';
  if (mode === 'focus') label = 'FOCUS TIME';
  if (mode === 'break') label = 'BREAK TIME';
  drawTimer(mode, m, s, label);
}
updateTimerDisplay();

async function startPomodoro(duration, nextMode) {
  await fetch(`/api/pomodoro/${window.CLASS_ID}/start`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ duration })
  });
  poll();
}

setInterval(() => {
  if (isRunning && timeLeft > 0) {
    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;
    timeLeft -= dt;
    
    if (timeLeft <= 0) {
      timeLeft = 0;
      isRunning = false;
      if (mode === 'focus') {
        mode = 'break';
        startPomodoro(300, 'break'); 
      } else if (mode === 'break') {
        mode = 'focus';
        startPomodoro(1500, 'focus'); 
      }
    }
    updateTimerDisplay();
  }
}, 1000);

let lastMessageId = 0;

async function poll() {
  try {
    const res = await fetch(`/api/poll/${window.CLASS_ID}`, { method: 'POST' });
    const data = await res.json();
    
    if (data.pomodoro) {
      mode = data.pomodoro.state;
      if (mode !== 'idle' && data.pomodoro.ends_at) {
        timeLeft = Math.max(0, Math.floor((new Date(data.pomodoro.ends_at).getTime() - Date.now()) / 1000));
        isRunning = true;
      } else {
        isRunning = false;
        timeLeft = mode === 'break' ? 300 : 1500;
      }
      updateTimerDisplay();
    }
    
    if (data.study_positions) {
      updateAvatarPositions(data.study_positions);
    }
    
    if (data.messages) {
      const chatBox = document.getElementById('chat-messages');
      data.messages.forEach(m => {
        if (m.id > lastMessageId) {
          lastMessageId = m.id;
          const el = document.createElement('div');
          el.className = 'chat-msg';
          el.innerHTML = `<span class="name">${m.name}</span>${m.content}`;
          chatBox.appendChild(el);
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      });
    }
  } catch (e) { console.error(e); }
}
setInterval(poll, 3000);
poll();

document.getElementById('btn-focus').onclick = () => startPomodoro(1500, 'focus');
document.getElementById('btn-break').onclick = () => startPomodoro(300, 'break');
document.getElementById('btn-stop').onclick = async () => {
  await fetch(`/api/pomodoro/${window.CLASS_ID}/stop`, { method: 'POST' });
  poll();
};

document.getElementById('chat-form').onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await fetch(`/api/announce/${window.CLASS_ID}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text })
  });
  poll();
};

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
