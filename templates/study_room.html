{% extends "base.html" %}
{% block title %}{{ cls.title }} - {{ T.room_study }}{% endblock %}
{% block content %}
<style>
  body { background: #0f172a !important; margin: 0; overflow: hidden; }
  #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
  .room-info { position: absolute; top: 20px; left: 20px; z-index: 10; color: #fff; background: rgba(15, 23, 42, 0.8); padding: 15px 20px; border-radius: 12px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); pointer-events: none; }
  .timer-overlay { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); z-index: 20; text-align: center; pointer-events: none; background: rgba(15, 23, 42, 0.85); padding: 20px 60px; border-radius: 24px; border: 2px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
  #timer-label { font-size: 20px; font-weight: bold; letter-spacing: 2px; color: #94a3b8; margin-bottom: 5px; }
  #timer-digits { font-size: 100px; font-weight: 900; font-family: ui-monospace, 'Courier New', monospace; line-height: 1; text-shadow: 0 0 20px rgba(96,165,250,0.4); }
  .state-focus #timer-digits { color: #60a5fa; }
  .state-break #timer-digits { color: #34d399; }
  .state-idle #timer-digits { color: #e2e8f0; }
  .ui-overlay { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 10; background: rgba(15, 23, 42, 0.8); padding: 15px 25px; border-radius: 50px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
  .ui-overlay button { padding: 10px 24px; border-radius: 30px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; transition: all 0.2s; }
  .ui-overlay button:hover { transform: scale(1.05); opacity: 0.9; }
  .btn-focus { background: #3b82f6; } .btn-break { background: #10b981; } .btn-stop { background: #ef4444; }
  .chat-panel { position: absolute; right: 20px; top: 20px; width: 300px; height: calc(100vh - 120px); background: rgba(30, 41, 59, 0.9); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; z-index: 10; backdrop-filter: blur(10px); }
  .chat-header { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); color: #fff; font-weight: bold; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; }
  .chat-msg { font-size: 13px; color: #e2e8f0; line-height: 1.4; word-break: break-all; }
  .chat-msg .name { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 2px; }
  .chat-input-area { padding: 10px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 8px; }
  .chat-input-area input { flex: 1; padding: 8px 12px; border-radius: 6px; border: none; background: rgba(0,0,0,0.3); color: #fff; outline: none; }
  .chat-input-area button { padding: 8px 12px; border-radius: 6px; border: none; background: #3b82f6; color: #fff; cursor: pointer; }
</style>

<div class="room-info">
  <h2 style="margin: 0; font-size: 20px; color: #e2e8f0;">{{ cls.title }}</h2>
  <div style="font-size: 13px; color: #94a3b8; margin-top: 4px;">{{ T.room_study }} · {{ cls.subject }} ({{ members|length }}/12)</div>
</div>

<div class="timer-overlay state-idle" id="timer-container">
  <div id="timer-label">READY</div>
  <div id="timer-digits">25:00</div>
</div>

<div id="canvas-container"></div>

<div class="ui-overlay">
  <button id="btn-focus" class="btn-focus">Focus (25m)</button>
  <button id="btn-break" class="btn-break">Break (5m)</button>
  <button id="btn-stop" class="btn-stop">Stop</button>
</div>

<div class="chat-panel">
  <div class="chat-header">Chat</div>
  <div class="chat-messages" id="chat-messages"></div>
  <form class="chat-input-area" id="chat-form">
    <input type="text" id="chat-input" placeholder="Message..." autocomplete="off">
    <button type="submit">Send</button>
  </form>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.CLASS_ID = {{ cls.id }};
window.USER_ID = {{ user.id }};
window.MEMBERS = {{ members|tojson }};

// ===== 基本セットアップ =====
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e293b);
scene.fog = new THREE.Fog(0x1e293b, 15, 40);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 8, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2, -2);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 5;
controls.maxDistance = 25;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xfff0d0, 1.0);
dirLight.position.set(5, 10, 5);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
scene.add(dirLight);

// 床と壁
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 }));
backWall.position.set(0, 5, -8);
scene.add(backWall);

// 入口サークル
const entrance = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.1, 32), new THREE.MeshStandardMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.5 }));
entrance.position.set(0, 0.05, 6);
scene.add(entrance);

// 座席の定義 (12席)
const seatPositions = [];
for (let row = 0; row < 3; row++) {
  for (let col = 0; col < 4; col++) {
    seatPositions.push({ x: -4.5 + col * 3, z: -2 + row * 3 });
  }
}

// 机と椅子の生成
function createDeskAndChair(x, z) {
  const group = new THREE.Group();
  const deskTop = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.09, 0.8), new THREE.MeshStandardMaterial({ color: 0xe0b88a }));
  deskTop.position.y = 0.7; deskTop.castShadow = true; deskTop.receiveShadow = true; group.add(deskTop);
  const legGeo = new THREE.BoxGeometry(0.09, 0.7, 0.09);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x5a4530 });
  [[-0.6, -0.32], [0.6, -0.32], [-0.6, 0.32], [0.6, 0.32]].forEach(([lx, lz]) => {
    const leg = new THREE.Mesh(legGeo, legMat); leg.position.set(lx, 0.35, lz); leg.castShadow = true; group.add(leg);
  });
  const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.08, 0.6), new THREE.MeshStandardMaterial({ color: 0x4a6fa5 }));
  chairSeat.position.set(0, 0.45, 0.9); chairSeat.castShadow = true; group.add(chairSeat);
  const chairBack = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.08), new THREE.MeshStandardMaterial({ color: 0x4a6fa5 }));
  chairBack.position.set(0, 0.75, 0.9 + 0.28); chairBack.castShadow = true; group.add(chairBack);
  group.position.set(x, 0, z);
  return group;
}
seatPositions.forEach((p) => { scene.add(createDeskAndChair(p.x, p.z)); });

function hashName(name) {
      let h = 0;
      for (let i = 0; i < name.length; i++) h = ((h<<5)-h + name.charCodeAt(i)) | 0;
      return Math.abs(h);
    }
    const SKIN_TONES = [0xffe0bd, 0xf1c27d, 0xe0ac69, 0xc68642, 0x8d5524, 0xffd8b0];
    const HAIR_COLORS = [0x1a1a1a, 0x2a1a0a, 0x3b2314, 0x5a3825, 0x8b4513, 0xd4a574, 0x1e293b, 0x6b3410];
    const SHIRT_COLORS = [0x3b82f6, 0xef4444, 0x10b981, 0xf59e0b, 0x8b5cf6, 0xec4899, 0x14b8a6, 0xf97316, 0x6366f1, 0x0ea5e9, 0x84cc16, 0x06b6d4];
    const PANTS_COLORS = [0x1e293b, 0x334155, 0x475569, 0x1e3a8a, 0x365314, 0x7c2d12, 0x4c1d95, 0x0f172a];
    const HAIR_STYLES = ["short", "long", "spiky", "ponytail", "bun"];

        // ---- custom fields from server (per member) ----

        style: m.custom_style || "",
      };
    });

    const HAIR_PALETTE = [
      0x1a1a1a, 0x2a1a0a, 0x3b2314, 0x5a3825, 0x8b4513,

    const SKIN_PALETTE = [

      0xa0e0d0, 0xe0b0d0,
    ];
    const SHIRT_PALETTE = [

      0x84cc16, 0x06b6d4, 0xa855f7, 0xdc2626,
    ];

    function paletteFor(name) {
      const h = hashName(name);
      const custom = CUSTOM_HANDLES[name] || { hair: -1, skin: -1, shirt: -1, style: "" };
      const base = {
        skin: SKIN_TONES[h % SKIN_TONES.length],
        hair: HAIR_COLORS[(h>>3) % HAIR_COLORS.length],
        shirt: SHIRT_COLORS[(h>>6) % SHIRT_COLORS.length],
        pants: PANTS_COLORS[(h>>9) % PANTS_COLORS.length],
        style: HAIR_STYLES[(h>>12) % HAIR_STYLES.length],
        headTilt: ((h>>15) % 10) / 200 - 0.025,
        bodyScale: 0.95 + (((h>>18) % 10) / 100),
      };
      if (custom.hair >= 0 && custom.hair < HAIR_PALETTE.length) base.hair = HAIR_PALETTE[custom.hair];
      if (custom.skin >= 0 && custom.skin < SKIN_PALETTE.length) base.skin = SKIN_PALETTE[custom.skin];
      if (custom.shirt >= 0 && custom.shirt < SHIRT_PALETTE.length) base.shirt = SHIRT_PALETTE[custom.shirt];
      if (custom.style) base.style = custom.style;
      return base;
    }

    function makeNameSprite(name, isTeacher) {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 64;
      const ctx = c.getContext("2d");
      const bg = isTeacher ? "rgba(245,158,11,0.95)" : "rgba(15,23,42,0.92)";
      const r = 22;
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.moveTo(8+r, 8); ctx.lineTo(248-r, 8);
      ctx.quadraticCurveTo(248, 8, 248, 8+r);
      ctx.lineTo(248, 56-r);
      ctx.quadraticCurveTo(248, 56, 248-r, 56);
      ctx.lineTo(8+r, 56);
      ctx.quadraticCurveTo(8, 56, 8, 56-r);
      ctx.lineTo(8, 8+r);
      ctx.quadraticCurveTo(8, 8, 8+r, 8);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 26px 'Hiragino Sans', sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(name, 128, 34);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, depthWrite: false, transparent: true });
      const sp = new THREE.Sprite(mat);
      sp.scale.set(1.5, 0.38, 1);
      sp.renderOrder = 999;
      return sp;
    }

    function buildHair(group, head, style, hairColor) {
      const hm = new THREE.MeshStandardMaterial({ color: hairColor, roughness: 0.8 });
      const hy = head.position.y;
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.44, 20, 16, 0, Math.PI*2, 0, Math.PI/1.75), hm);
      cap.position.y = hy + 0.03;
      cap.castShadow = true;
      group.add(cap);
      if (style === "long") {
        const back = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.22), hm);
        back.position.set(0, hy - 0.25, -0.32);
        back.castShadow = true;
        group.add(back);
        const strand = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.5, 0.15), hm);
        strand.position.set(0.28, hy - 0.2, 0.15);
        group.add(strand);
      } else if (style === "spiky") {
        const cone = new THREE.ConeGeometry(0.09, 0.26, 6);
        for (let i = 0; i < 7; i++) {
          const spike = new THREE.Mesh(cone, hm);
          const a = (i/7)*Math.PI*2;
          spike.position.set(Math.cos(a)*0.26, hy + 0.46, Math.sin(a)*0.26);
          spike.rotation.z = -Math.cos(a)*0.38;
          spike.rotation.x = Math.sin(a)*0.38;
          spike.castShadow = true;
          group.add(spike);
        }
      } else if (style === "ponytail") {
        const pony = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.5, 6, 10), hm);
        pony.position.set(0, hy - 0.1, -0.5);
        pony.rotation.x = 0.4;
        pony.castShadow = true;
        group.add(pony);
        const tie = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.03, 6, 12),
          new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.6 }));
        tie.position.set(0, hy + 0.05, -0.42);
        tie.rotation.x = Math.PI / 2;
        group.add(tie);
      } else if (style === "bun") {
        const bun = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 12), hm);
        bun.position.set(0, hy + 0.5, -0.15);
        bun.castShadow = true;
        group.add(bun);
      }

    }
    
    targetPositions[uid] = { x: targetX, z: targetZ, seated: isSeated };
    
    if (!avatarMap[uid]) {
      // 教室の関数仕様に完全に合わせる
      const av = createChibiAvatar({ 
        name: m.name, 
        seated: isSeated, 
        skinKey: m.skin || "default",
        isTeacher: m.role === "teacher"
      });
      av.position.set(targetX, 0, targetZ);
      // 教室と同様、正面（黒板の方向）を向く
      av.rotation.y = 0; 
      scene.add(av);
      avatarMap[uid] = av;
    } else {
      // 既存のアバターの座り状態を更新（高さ調整）
      const av = avatarMap[uid];
      try {
        const body = av.children.find(c => c.geometry && c.geometry.type === 'CapsuleGeometry');
        const headGroup = av.children.find(c => c.type === 'Group' && c.children.some(cc => cc.geometry && cc.geometry.type === 'SphereGeometry'));
        if (body && headGroup) {
           if (isSeated && body.position.y !== 0.68) {
             body.position.y = 0.68; headGroup.position.y = 1.20;
           } else if (!isSeated && body.position.y !== 0.85) {
             body.position.y = 0.85; headGroup.position.y = 1.40;
           }
        }
      } catch (e) {}
    }
  });
}

if (window.MEMBERS && window.MEMBERS.length > 0) {
  updateAvatarPositions(window.MEMBERS, {});
}

function animate() {
  requestAnimationFrame(animate);
  Object.keys(targetPositions).forEach(uid => {
    const av = avatarMap[uid];
    const target = targetPositions[uid];
    if (av && target) {
      av.position.x += (target.x - av.position.x) * 0.1;
      av.position.z += (target.z - av.position.z) * 0.1;
    }
  });
  controls.update();
  renderer.render(scene, camera);
}
animate();

// 席のクリック判定
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const clickableSeats = [];
seatPositions.forEach((p, i) => {
  const hitBox = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshBasicMaterial({ visible: false }));
  hitBox.position.set(p.x, 0.5, p.z + 0.5);
  hitBox.userData.seatIndex = i;
  scene.add(hitBox);
  clickableSeats.push(hitBox);
});

container.addEventListener('pointerdown', (e) => {
  const startX = e.clientX;
  const startY = e.clientY;
  const onPointerUp = async (upEvent) => {
    if (Math.abs(upEvent.clientX - startX) > 5 || Math.abs(upEvent.clientY - startY) > 5) return;
    mouse.x = (upEvent.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(upEvent.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableSeats);
    if (intersects.length > 0) {
      const seatIdx = intersects[0].object.userData.seatIndex;
      await fetch(`/api/study/${window.CLASS_ID}/move`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seat_index: seatIdx })
      });
      poll();
    }
    container.removeEventListener('pointerup', onPointerUp);
  };
  container.addEventListener('pointerup', onPointerUp);
});

// タイマーロジック
let timeLeft = 1500;
let isRunning = false;
let mode = 'idle';
let lastTime = performance.now();

function updateTimerDisplay() {
  const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
  const s = String(Math.floor(timeLeft % 60)).padStart(2, '0');
  let label = 'READY', cls = 'state-idle';
  if (mode === 'focus') { label = 'FOCUS TIME'; cls = 'state-focus'; }
  if (mode === 'break') { label = 'BREAK TIME'; cls = 'state-break'; }
  document.getElementById('timer-label').textContent = label;
  document.getElementById('timer-digits').textContent = `${m}:${s}`;
  document.getElementById('timer-container').className = `timer-overlay ${cls}`;
}
updateTimerDisplay();

async function startPomodoro(duration) {
  await fetch(`/api/pomodoro/${window.CLASS_ID}/start`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ duration })
  });
  poll();
}

setInterval(() => {
  if (isRunning && timeLeft > 0) {
    const now = performance.now();
    const dt = (now - lastTime) / 1000;
    lastTime = now;
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      isRunning = false;
      if (mode === 'focus') { mode = 'break'; startPomodoro(300); }
      else if (mode === 'break') { mode = 'focus'; startPomodoro(1500); }
    }
    updateTimerDisplay();
  }
}, 1000);

let lastMessageId = 0;
let hasAutoSeated = false;

async function poll() {
  try {
    const res = await fetch(`/api/poll/${window.CLASS_ID}`, { method: 'POST' });
    const data = await res.json();
    
    if (data.pomodoro) {
      mode = data.pomodoro.state;
      if (mode !== 'idle' && data.pomodoro.ends_at) {
        timeLeft = Math.max(0, Math.floor((new Date(data.pomodoro.ends_at).getTime() - Date.now()) / 1000));
        isRunning = true;
      } else {
        isRunning = false;
        timeLeft = mode === 'break' ? 300 : 1500;
      }
      updateTimerDisplay();
    }
    
    const membersList = (data.members && data.members.length > 0) ? data.members : (window.MEMBERS || []);
    const studyPos = data.study_positions || {};
    
    if (membersList.length > 0) {
      updateAvatarPositions(membersList, studyPos);
      if (!hasAutoSeated) {
        const mySeat = studyPos[String(window.USER_ID)];
        if (mySeat === undefined) {
          const occupied = new Set(Object.values(studyPos));
          for (let i = 0; i < seatPositions.length; i++) {
            if (!occupied.has(i)) {
              await fetch(`/api/study/${window.CLASS_ID}/move`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seat_index: i })
              });
              hasAutoSeated = true;
              setTimeout(poll, 500); 
              break;
            }
          }
        } else { hasAutoSeated = true; }
      }
    }
    
    if (data.messages) {
      const chatBox = document.getElementById('chat-messages');
      data.messages.forEach(m => {
        if (m.id > lastMessageId) {
          lastMessageId = m.id;
          const el = document.createElement('div');
          el.className = 'chat-msg';
          el.innerHTML = `<span class="name">${m.name}</span>${m.content}`;
          chatBox.appendChild(el);
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      });
    }
  } catch (e) { console.error(e); }
}
setInterval(poll, 3000);
poll();

document.getElementById('btn-focus').onclick = () => startPomodoro(1500);
document.getElementById('btn-break').onclick = () => startPomodoro(300);
document.getElementById('btn-stop').onclick = async () => {
  await fetch(`/api/pomodoro/${window.CLASS_ID}/stop`, { method: 'POST' });
  poll();
};

document.getElementById('chat-form').onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await fetch(`/api/announce/${window.CLASS_ID}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text })
  });
  poll();
};

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
