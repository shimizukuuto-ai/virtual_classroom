{% extends "base.html" %}
{% block title %}名前の設定 - {{ T.app_title }}{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
  <h1>ようこそ！</h1>
  <p class="muted">アプリ内で表示される名前を決めてください。</p>
  <form method="post" action="/setup-name">
    <input type="text" name="display_name" value="{{ user.display_name or user.name }}" required autofocus style="margin-bottom: 16px;">
    <button type="submit" class="btn" style="width: 100%;">決定して始める</button>
  </form>
</div>
{% endblock %}
