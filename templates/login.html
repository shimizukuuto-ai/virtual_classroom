{% extends "base.html" %}
{% block title %}{{ T.login_title }} - {{ T.app_title }}{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ T.login_title }}</h1>
  <p class="muted">{{ T.login_desc }}</p>
  <form id="login-form" method="post" action="/login">
    <input type="text" name="name" placeholder="{{ T.name }}" required autofocus>
    <button type="submit">{{ T.enter }}</button>
  </form>
  <p class="muted" style="margin-top:14px;">
    タブごとに別アカウントでログインできます。<br>
    別のタブで開いて、違う名前で入ってください。
  </p>
</div>

<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const res = await fetch("/login", {
    method: "POST",
    body: fd,
    headers: { "Accept": "application/json" }
  });
  if (!res.ok) { alert("Login failed"); return; }
  const d = await res.json();
  sessionStorage.setItem("uid", d.id);
  location.href = "/dashboard?uid=" + d.id;
});
</script>
{% endblock %}
