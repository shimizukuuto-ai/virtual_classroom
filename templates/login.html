{% extends "base.html" %}
{% block title %}{{ T.login_title }} - {{ T.app_title }}{% endblock %}
{% block content %}
<style>
.login-hero { max-width: 440px; margin: 60px auto 0; text-align: center; }
.login-hero .big-logo {
  width: 72px; height: 72px; border-radius: 22px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 26px; font-weight: 800;
  margin: 0 auto 20px;
  box-shadow: 0 12px 32px rgba(99,102,241,.3);
}
.login-hero h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px; letter-spacing: -.02em; }
.login-hero p { color: var(--text-muted); margin: 0 0 32px; font-size: 15px; }
.login-form {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 32px;
  box-shadow: var(--shadow-lg);
}
.login-form input { margin-bottom: 12px; }
.login-form button { width: 100%; }
.footnote { color: var(--text-soft); font-size: 12px; margin-top: 20px; }
</style>

<div class="login-hero">
  <div class="big-logo">WC</div>
  <h1>{{ T.login_title }}</h1>
  <p>{{ T.login_desc }}</p>
  
<div style="margin-top: 24px; text-align: center;">
  
  <a href="/login/google" class="btn" style="background: #db4437; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px;">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>
    {{ T.google_login }}
  </a>
</div>
  <div class="footnote">{{ T.login_footnote }}</div>
</div>


{% endblock %}
