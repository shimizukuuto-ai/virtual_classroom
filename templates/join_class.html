{% extends "base.html" %}
{% block title %}{{ T.join_code }}{% endblock %}
{% block content %}
<style>
.center-wrap { max-width: 480px; margin: 40px auto 0; text-align: center; }
.center-wrap .ic {
  width: 64px; height: 64px; border-radius: 20px;
  background: var(--primary-soft); color: var(--primary);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px;
}
.center-wrap .ic svg { width: 30px; height: 30px; }
.center-wrap h1 { font-size: 26px; font-weight: 800; margin: 0 0 8px; letter-spacing: -.02em; }
.center-wrap p { color: var(--text-muted); margin: 0 0 28px; }
.code-form {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 28px;
  box-shadow: var(--shadow-lg);
}
.code-form input {
  text-align: center; font-size: 22px; font-weight: 700;
  letter-spacing: .15em; padding: 16px;
}
.code-form button { width: 100%; margin-top: 12px; }
</style>

<div class="center-wrap">
  <div class="ic">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 2l-2 2m-7.6 7.6a5 5 0 1 0-7 7 5 5 0 0 0 7-7zm0 0L15 8m0 0 3 3m-3-3 3-3m-3 3-3-3"></path>
    </svg>
  </div>
  <h1>{{ T.join_hero_title }}</h1>
  <p>{{ T.join_hero_desc }}</p>
  <form method="post" action="/join_class" class="code-form">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="text" name="join_code" placeholder="{{ T.join_input_ph }}" required autofocus maxlength="6">
    <button class="btn lg" type="submit">{{ T.join_button }}</button>
  </form>
</div>
{% endblock %}
