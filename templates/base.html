<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ T.app_title }}{% endblock %}</title>
<style>
:root {
  --bg: #f7f7f8;
  --surface: #ffffff;
  --surface-2: #fafafa;
  --border: #e8e8ec;
  --text: #18181b;
  --text-muted: #71717a;
  --text-soft: #a1a1aa;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --primary-soft: #eef2ff;
  --teacher: #f59e0b;
  --teacher-soft: #fef3c7;
  --student: #10b981;
  --student-soft: #d1fae5;
  --danger: #ef4444;
  --danger-soft: #fee2e2;
  --success: #10b981;
  --radius: 14px;
  --radius-sm: 10px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 4px 12px rgba(0,0,0,.05);
  --shadow-lg: 0 12px 32px rgba(0,0,0,.08);
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

/* header */
.hdr {
  background: rgba(255,255,255,.85);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.hdr .brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; font-size: 16px; letter-spacing: -.01em;
}
.hdr .brand .logo {
  width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px; font-weight: 800;
  box-shadow: 0 4px 12px rgba(99,102,241,.3);
}
.hdr nav { display: flex; align-items: center; gap: 4px; }
.hdr nav a {
  padding: 7px 14px; border-radius: 8px;
  font-size: 14px; color: var(--text-muted); font-weight: 500;
  transition: all .15s;
}
.hdr nav a:hover { background: var(--surface-2); color: var(--text); }
.hdr .avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  color: #fff; font-weight: 700; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  margin-right: 8px;
}
.hdr .lang a {
  padding: 4px 8px; border-radius: 6px; font-size: 12px;
  color: var(--text-soft); font-weight: 600;
}
.hdr .lang a.active { background: var(--text); color: #fff; }
.badge-count {
  background: var(--danger); color: #fff; font-size: 10px;
  padding: 1px 7px; border-radius: 8px; margin-left: 4px; font-weight: 700;
}

/* main */
main { max-width: 1080px; margin: 32px auto; padding: 0 20px; }
main.wide { max-width: 1400px; }

/* cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.card h1, .card h2, .card h3 { margin-top: 0; letter-spacing: -.015em; }
.card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.card h2 { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
.card h3 { font-size: 14px; font-weight: 600; color: var(--text-muted); }

/* form */
label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; margin-top: 14px; }
input[type=text], input[type=number], textarea, select {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-size: 15px; font-family: inherit; background: var(--surface);
  color: var(--text); transition: all .15s;
  margin-bottom: 4px;
}
input:focus, textarea:focus, select:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(99,102,241,.1);
}
textarea { resize: vertical; min-height: 80px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px; border-radius: var(--radius-sm);
  background: var(--primary); color: #fff; border: none;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all .15s; text-decoration: none;
  font-family: inherit;
}
.btn:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,.25); }
.btn:active { transform: translateY(0); }
.btn.ghost { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--text-soft); box-shadow: var(--shadow-sm); }
.btn.gray { background: #71717a; }
.btn.gray:hover { background: #52525b; }
.btn.green { background: var(--success); }
.btn.green:hover { background: #059669; }
.btn.orange { background: var(--teacher); }
.btn.orange:hover { background: #d97706; }
.btn.red { background: var(--danger); }
.btn.red:hover { background: #dc2626; }
.btn.sm { padding: 7px 12px; font-size: 13px; }
.btn.lg { padding: 13px 24px; font-size: 15px; }

/* class items */
.class-item {
  display: block; padding: 16px 18px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom: 10px; background: var(--surface);
  transition: all .15s;
}
.class-item:hover {
  border-color: var(--primary); background: var(--primary-soft);
  transform: translateY(-1px); box-shadow: var(--shadow);
}
.class-item .title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.class-item .meta { font-size: 12px; color: var(--text-muted); }

/* misc */
.muted { color: var(--text-muted); font-size: 13px; }
.error { color: var(--danger); font-size: 13px; margin-bottom: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.pill {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 700; letter-spacing: .02em;
  background: var(--primary-soft); color: var(--primary);
}
.pill.teacher { background: var(--teacher-soft); color: #b45309; }
.pill.student { background: var(--student-soft); color: #047857; }
</style>
</head>
<body>
<header class="hdr">
  <a href="/dashboard" class="brand">
    <div class="logo">WC</div>
    <span>{{ T.app_title }}</span>
  </a>
  <nav>
    {% if user %}
      <a href="/dashboard">{{ T.home }}</a>
      <a href="/classes">{{ T.join_class }}</a>
      <a href="/u/{{ user.id }}" style="display:flex;align-items:center;">
        <span class="avatar">{{ user.name[0]|upper }}</span>
        <span>{{ user.name }}</span>
      </a>
      <span class="lang">
        <a href="/lang/ja" class="{% if lang == 'ja' %}active{% endif %}">JA</a>
        <a href="/lang/en" class="{% if lang == 'en' %}active{% endif %}">EN</a>
      </span>
      <a href="/logout" style="color:var(--text-soft);">{{ T.logout }}</a>
    {% else %}
      <span class="lang">
        <a href="/lang/ja" class="{% if lang == 'ja' %}active{% endif %}">JA</a>
        <a href="/lang/en" class="{% if lang == 'en' %}active{% endif %}">EN</a>
      </span>
    {% endif %}
  </nav>
</header>
<main class="{% block main_class %}{% endblock %}">
{% block content %}{% endblock %}
</main>
</body>
</html>
