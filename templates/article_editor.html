{% extends "base.html" %}
{% block title %}{{ T.new_article }} - {{ T.app_title }}
<script>
document.querySelector('form').addEventListener('submit', function() {
  sessionStorage.setItem('just_posted_article', '1');
});
</script>

{% endblock %}

{% block extra_head %}
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<style>
  .ql-container { font-family: inherit; font-size: 16px; background: #fff; color: #000; min-height: 400px; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
  .ql-toolbar { background: #f8fafc; border-top-left-radius: 8px; border-top-right-radius: 8px; }
</style>

<script>
document.querySelector('form').addEventListener('submit', function() {
  sessionStorage.setItem('just_posted_article', '1');
});
</script>

{% endblock %}

{% block content %}
<div class="card">
  <h1>{{ T.new_article }}</h1>
  <form method="post" action="/articles/new" id="article-form">
    <label>{{ T.class_name }}</label>
    <select name="class_id" required style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 6px;">
      {% for c in classes %}
        <option value="{{ c.id }}">{{ c.title }} ({{ c.subject }})</option>
      {% endfor %}
    </select>

    <label>{{ T.post_title }}</label>
    <input type="text" name="title" id="article-title" required style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <label style="margin: 0;">{{ T.post_content }}</label>
      <span style="font-size: 12px; color: #64748b;">{{ T.editor_hint }}</span>
    </div>
    
    <!-- Quill エディタ -->
    <div id="article-editor" style="margin-bottom: 20px;"></div>
    <input type="hidden" name="content" id="article-content-input">

    <div style="display: flex; gap: 10px;">
      <button type="submit" class="btn" id="btn-submit-article">{{ T.submit_post }}</button>
      <a href="/articles" class="btn gray">{{ T.cancel }}</a>
    </div>
  </form>
</div>

<script>
  const quill = new Quill('#article-editor', {
    theme: 'snow',
    modules: {
      toolbar: [
        [{ 'header': [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        ['blockquote', 'code-block'],
        ['link', 'image'],
        ['clean']
      ]
    },
    placeholder: 'ここに記事を書きます...'
  });

  // 画像アップロード処理
  const toolbar = quill.getModule('toolbar');
  toolbar.addHandler('image', () => {
    const input = document.createElement('input');
    input.setAttribute('type', 'file');
    input.setAttribute('accept', 'image/*');
    input.click();
    input.onchange = async () => {
      const file = input.files[0];
      if (file) {
        const fd = new FormData(); fd.append('file', file);
        try {
          const res = await fetch('/api/upload_global', { method: 'POST', body: fd });
          const d = await res.json();
          if (res.ok) {
            const range = quill.getSelection(true);
            quill.insertEmbed(range.index, 'image', d.url);
          } else { alert("Upload failed: " + d.error); }
        } catch(e) { alert("Error: " + e); }
      }
    };
  });

  // 送信時にHTMLを隠しフィールドに格納
  document.getElementById('article-form').addEventListener('submit', (e) => {
    const html = quill.root.innerHTML;
    if (quill.getText().trim().length === 0) {
      e.preventDefault();
      alert('本文が空です');
      return;
    }
    document.getElementById('article-content-input').value = html;
  });
</script>

<script>
document.querySelector('form').addEventListener('submit', function() {
  sessionStorage.setItem('just_posted_article', '1');
});
</script>

{% endblock %}
