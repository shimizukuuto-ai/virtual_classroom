{% extends "base.html" %}
{% block title %}{{ T.create_class }} - {{ T.app_title }}{% endblock %}
{% block content %}
<style>
.form-wrap { max-width: 640px; margin: 0 auto; }
.form-head { margin-bottom: 28px; }
.form-head h1 { margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.form-head p { color: var(--text-muted); margin: 0; }
.form-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 28px;
  box-shadow: var(--shadow-sm);
}
.hint { font-size: 12px; color: var(--text-soft); margin-top: 4px; }
</style>

<div class="form-wrap">
  <div class="form-head">
    <h1>{{ T.create_class }}</h1>
    <p>教えたいことをクラスとして開きましょう</p>
  </div>

  <form method="post" action="/create_class" class="form-card">
    <label>{{ T.class_name }}</label>
    <input type="text" name="title" required placeholder="例: 線形代数入門">

    <label>{{ T.subject }}</label>
    <input type="text" name="subject" required placeholder="例: 数学">

    <label>{{ T.description }}</label>
    <textarea name="description" rows="3" placeholder="どんなことを教えるか、対象は誰か"></textarea>

    <label>公開設定</label>
    <select name="is_public">
      <option value="1">🌐 公開（検索で見つかる）</option>
      <option value="0">🔒 非公開（参加コードのみ）</option>
    </select>

    <label>進行ステップ（1行に1つ）</label>
    <textarea name="steps_text" rows="8" placeholder="{{ default_steps|join('\n') }}"></textarea>
    <div class="hint">空欄なら「自由進行」になります。後から追加・削除できます。</div>

    <button type="submit" class="btn lg" style="width:100%; margin-top:20px;">{{ T.create }} →</button>
  </form>
</div>
{% endblock %}
